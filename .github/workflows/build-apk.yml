
name: JARVIS APK Builder

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract JARVIS project
        run: |
          unzip -o JARVIS_V9_3_GEMINI_GROQ_HYBRID_SOURCE.zip -d project

      - name: Fix Java Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/JARVIS_V8/app/build.gradle")
          s = p.read_text()

          fix = """
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """

          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              s = s.replace("android {", "android {" + fix, 1)

          p.write_text(s)
          PY

      - name: Build APK
        run: |
          cd project/JARVIS_V8
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: project/JARVIS_V8/app/build/outputs/apk/debug/*.apk
          
